name: scrape-jams
on:
  # 毎月 1・11・21日 00:00 JST。cron は UTC なので前日 15:00 に起き、JST の日付で絞る
  # （月末が28〜31日で揺れるため、28〜31日は全部起こして判定する）
  schedule:
    - cron: "0 15 10,20,28,29,30,31 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テスト（選ぶだけで保存しない）"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 実行日か確かめる（JST で 1・11・21日だけ）
        id: day
        run: |
          d=$(TZ=Asia/Tokyo date +%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$d" = "01" ] || [ "$d" = "11" ] || [ "$d" = "21" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "JST $d 日なので何もしない"
          fi
      - uses: actions/checkout@v4
        if: steps.day.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.day.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.day.outputs.go == 'true'
        run: npm ci
      - if: steps.day.outputs.go == 'true'
        run: npm run verify
      - if: steps.day.outputs.go == 'true' && inputs.dry_run == true
        run: npm run try
      - if: steps.day.outputs.go == 'true' && inputs.dry_run != true
        run: npm run scrape
      - name: 変わったときだけコミット
        if: steps.day.outputs.go == 'true' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jams.json
          git diff --cached --quiet || git commit -m "data: jams.json を更新"
          git push
